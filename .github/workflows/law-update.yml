name: Publish verified legal framework changes

on:
  push:
    branches:
      - "automation/legal-release/**"

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

concurrency:
  group: noa-legal-intelligence
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: noa-production-publication
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Verify isolated cloud release scope
        run: |
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD || { echo "Release is stale; regenerate from current main"; exit 1; }
          npx tsx scripts/check-update-scope.ts --mode law --base origin/main
          test -f updates/research/law-evidence.json
          test -f updates/candidates/law.json
          test -f updates/candidates/law-verification.json
          test -f updates/candidates/law.md
          test -f updates/pending-state/law.json
          npx tsx scripts/check-critical-sources.ts --mode law
      - name: Determine whether public content changed
        id: release
        shell: bash
        run: |
          git show origin/main:public/deployment-marker.json > "$RUNNER_TEMP/previous-marker.json"
          current="$(node -p "require('./public/deployment-marker.json').publicationId")"
          previous="$(node -p "require('$RUNNER_TEMP/previous-marker.json').publicationId")"
          if [ "$current" = "$previous" ]; then changed=false; else changed=true; fi
          echo "public_changed=$changed" >> "$GITHUB_OUTPUT"
          echo "publication_id=$current" >> "$GITHUB_OUTPUT"
          echo "previous_publication_id=$previous" >> "$GITHUB_OUTPUT"
      - name: Validate complete release artifact
        env:
          URL: https://haidarra82066.github.io
          BASE_PATH: /noa-energy-atlas
        run: npm run validate:content && npm test && npm audit --omit=dev --audit-level=high && npm run build
      - name: Build prior revision for rollback
        if: steps.release.outputs.public_changed == 'true'
        shell: bash
        env:
          URL: https://haidarra82066.github.io
          BASE_PATH: /noa-energy-atlas
        run: |
          git worktree add "$RUNNER_TEMP/noa-rollback" origin/main
          cd "$RUNNER_TEMP/noa-rollback"
          npm ci
          npm run build
          mv dist "$GITHUB_WORKSPACE/rollback-dist"
      - name: Upload current immutable Pages artifact
        if: steps.release.outputs.public_changed == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-law-${{ github.run_id }}
          path: dist
      - name: Upload rollback Pages artifact
        if: steps.release.outputs.public_changed == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-law-rollback-${{ github.run_id }}
          path: rollback-dist
      - name: Atomically deploy current artifact
        if: steps.release.outputs.public_changed == 'true'
        id: deploy
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-law-${{ github.run_id }}
      - name: Smoke-test exact public marker
        if: steps.release.outputs.public_changed == 'true'
        id: smoke
        env:
          PUBLICATION_ID: ${{ steps.release.outputs.publication_id }}
          SMOKE_TIMEOUT_MS: "240000"
        run: node scripts/smoke-production.mjs https://haidarra82066.github.io/noa-energy-atlas "$PUBLICATION_ID"
      - name: Advance state and main only after validation and smoke success
        if: success()
        shell: bash
        run: |
          npx tsx scripts/promote-update-state.ts --mode law
          git config user.name "noa-atlas-publisher"
          git config user.email "noa-atlas-publisher@users.noreply.github.com"
          git add updates/state/law.json updates/pending-state/law.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(intelligence): promote cloud legal state ${{ steps.release.outputs.publication_id }} [skip pages]"
          fi
          git push origin HEAD:main
      - name: Roll back if any post-deploy gate fails
        if: failure() && steps.deploy.outcome == 'success'
        id: rollback
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-law-rollback-${{ github.run_id }}
      - name: Verify restored public marker
        if: failure() && steps.rollback.outcome == 'success'
        env:
          PUBLICATION_ID: ${{ steps.release.outputs.previous_publication_id }}
          SMOKE_TIMEOUT_MS: "240000"
        run: node scripts/smoke-production.mjs https://haidarra82066.github.io/noa-energy-atlas "$PUBLICATION_ID"
      - name: Publication summary
        if: always()
        run: echo "Cloud legal release ${{ job.status }}; publication ${{ steps.release.outputs.publication_id || 'unavailable' }}; public change ${{ steps.release.outputs.public_changed || 'unknown' }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: legal-publication-failure-${{ github.run_id }}
          path: |
            updates/research/law-evidence.json
            updates/candidates/law.json
            updates/candidates/law-verification.json
            updates/candidates/law.md
          if-no-files-found: ignore
          retention-days: 30
