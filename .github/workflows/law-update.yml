name: Publish verified legal framework changes
on:
  schedule:
    - cron: "41 5,6 1,15 * *"
  workflow_dispatch:
permissions: { contents: write, actions: read, models: read }
concurrency: { group: noa-legal-intelligence, cancel-in-progress: false }

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    concurrency: { group: noa-production-publication, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22.19.0, cache: npm, cache-dependency-path: package-lock.json }
      - run: npm ci
      - name: Check exact Beirut 1st/15th window
        id: gate
        shell: bash
        env: { FORCE_RUN: "${{ github.event_name == 'workflow_dispatch' }}" }
        run: |
          force=""; if [ "$FORCE_RUN" = "true" ]; then force="--force"; fi
          npx tsx scripts/schedule-guard.ts --mode law $force --github-output "$GITHUB_OUTPUT"
      - name: Verify scoped credentials
        if: steps.gate.outputs.should_run == 'true'
        shell: bash
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          test -n "$NETLIFY_AUTH_TOKEN" || { echo "NETLIFY_AUTH_TOKEN is missing"; exit 1; }
          test -n "$NETLIFY_SITE_ID" || { echo "NETLIFY_SITE_ID is missing"; exit 1; }
          test "$NETLIFY_SITE_ID" = "ffdfa234-6474-4155-af51-7e08c6b6c3b9" || { echo "Refusing an unrelated Netlify site"; exit 1; }
      - name: Research controlling legal sources and discovery indexes
        if: steps.gate.outputs.should_run == 'true'
        shell: bash
        env:
          AI_BASE_URL: https://models.github.ai/inference
          AI_MODEL: openai/gpt-4o
          AI_API_KEY: ${{ github.token }}
          INTELLIGENCE_FETCH_CONCURRENCY: "4"
        run: |
          for attempt in 1 2; do npm run update:laws && break; if [ "$attempt" = "2" ]; then exit 1; fi; sleep 30; done
          npx tsx scripts/check-critical-sources.ts --mode law
      - name: Integrate controlling-source legal changes
        if: steps.gate.outputs.should_run == 'true'
        id: integrate
        run: |
          npx tsx scripts/auto-publish.ts --mode law --github-output "$GITHUB_OUTPUT"
          npx tsx scripts/check-update-scope.ts --mode law
      - name: Validate complete release artifact
        if: steps.gate.outputs.should_run == 'true'
        run: npm run validate:content && npm test && npm audit --omit=dev --audit-level=high && npm run build
      - name: Create local immutable release commit
        if: steps.gate.outputs.should_run == 'true' && steps.integrate.outputs.public_changed == 'true'
        run: |
          git config user.name "noa-atlas-publisher"; git config user.email "noa-atlas-publisher@users.noreply.github.com"
          git checkout -b "automation/legal-release-${{ github.run_id }}"
          git add updates/research/law-evidence.json updates/candidates/law.json updates/candidates/law-verification.json updates/candidates/law.md updates/pending-state/law.json updates/publication-ledger-law.jsonl src/data/automated-publications.json public/deployment-marker.json
          git commit -m "feat(intelligence): verified legal release ${{ steps.integrate.outputs.publication_id }}"
      - name: Capture current production deploy for rollback
        if: steps.gate.outputs.should_run == 'true' && steps.integrate.outputs.public_changed == 'true'
        id: previous
        env: { NETLIFY_AUTH_TOKEN: "${{ secrets.NETLIFY_AUTH_TOKEN }}", NETLIFY_SITE_ID: "${{ secrets.NETLIFY_SITE_ID }}" }
        run: |
          id=$(curl -fsS -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" "https://api.netlify.com/api/v1/sites/$NETLIFY_SITE_ID/deploys?per_page=1" | jq -r '.[0].id')
          test -n "$id" && test "$id" != "null"; echo "deploy_id=$id" >> "$GITHUB_OUTPUT"
      - name: Atomically deploy built artifact
        if: steps.gate.outputs.should_run == 'true' && steps.integrate.outputs.public_changed == 'true'
        id: deploy
        env: { NETLIFY_AUTH_TOKEN: "${{ secrets.NETLIFY_AUTH_TOKEN }}", NETLIFY_SITE_ID: "${{ secrets.NETLIFY_SITE_ID }}" }
        run: npx --yes netlify-cli deploy --prod --dir=dist --site="$NETLIFY_SITE_ID" --auth="$NETLIFY_AUTH_TOKEN" --message="Verified legal ${{ steps.integrate.outputs.publication_id }}"
      - name: Smoke-test exact public marker
        if: steps.gate.outputs.should_run == 'true' && steps.integrate.outputs.public_changed == 'true'
        env: { PUBLICATION_ID: "${{ steps.integrate.outputs.publication_id }}", SMOKE_TIMEOUT_MS: "240000" }
        run: node scripts/smoke-production.mjs https://noa-energy-atlas.netlify.app "$PUBLICATION_ID"
      - name: Advance state and publish release commit only after smoke success
        if: steps.gate.outputs.should_run == 'true' && steps.integrate.outputs.public_changed == 'true'
        run: |
          npx tsx scripts/promote-update-state.ts --mode law
          git add updates/state/law.json updates/pending-state/law.json
          git commit --amend --no-edit
          git push origin HEAD:main
      - name: Commit successful no-op state without deploying
        if: steps.gate.outputs.should_run == 'true' && steps.integrate.outputs.public_changed != 'true'
        run: |
          npx tsx scripts/promote-update-state.ts --mode law
          git config user.name "noa-atlas-publisher"; git config user.email "noa-atlas-publisher@users.noreply.github.com"
          git add updates/research/law-evidence.json updates/candidates/law.json updates/candidates/law-verification.json updates/candidates/law.md updates/pending-state/law.json updates/state/law.json updates/publication-ledger-law.jsonl
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(intelligence): successful legal no-op ${{ steps.gate.outputs.local_date }}"
          git push origin HEAD:main
      - name: Roll back if any post-deploy gate fails
        if: failure() && steps.deploy.outcome == 'success'
        env: { NETLIFY_AUTH_TOKEN: "${{ secrets.NETLIFY_AUTH_TOKEN }}", NETLIFY_SITE_ID: "${{ secrets.NETLIFY_SITE_ID }}", PREVIOUS_DEPLOY_ID: "${{ steps.previous.outputs.deploy_id }}" }
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" "https://api.netlify.com/api/v1/sites/$NETLIFY_SITE_ID/deploys/$PREVIOUS_DEPLOY_ID/restore"
      - name: Publication summary
        if: always() && steps.gate.outputs.should_run == 'true'
        run: |
          echo "Legal run ${{ job.status }}; published ${{ steps.integrate.outputs.published_count || '0' }}; publication ${{ steps.integrate.outputs.publication_id || 'no-op' }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with: { name: "legal-publication-failure-${{ github.run_id }}", path: "updates/research/law-evidence.json\nupdates/candidates/law.json\nupdates/candidates/law-verification.json\nupdates/candidates/law.md", if-no-files-found: ignore, retention-days: 30 }
