name: Publish verified legal framework changes

on:
  schedule:
    - cron: "41 5,6 1,15 * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

concurrency:
  group: noa-legal-intelligence
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: noa-production-publication
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Check exact Beirut 1st/15th window
        id: gate
        shell: bash
        env:
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          force=""; if [ "$FORCE_RUN" = "true" ]; then force="--force"; fi
          npx tsx scripts/schedule-guard.ts --mode law $force --github-output "$GITHUB_OUTPUT"
      - name: Verify scoped analysis credentials
        if: steps.gate.outputs.should_run == 'true'
        shell: bash
        env:
          AI_API_KEY: ${{ secrets.INTELLIGENCE_API_KEY }}
          AI_MODEL: ${{ vars.INTELLIGENCE_MODEL }}
        run: |
          test -n "$AI_API_KEY" || { echo "INTELLIGENCE_API_KEY is missing"; exit 1; }
          test -n "$AI_MODEL" || { echo "INTELLIGENCE_MODEL repository variable is missing"; exit 1; }
      - name: Build prior revision for rollback
        if: steps.gate.outputs.should_run == 'true'
        id: previous
        shell: bash
        env:
          URL: https://haidarra82066.github.io
          BASE_PATH: /noa-energy-atlas
        run: |
          echo "publication_id=$(node -p "require('./public/deployment-marker.json').publicationId")" >> "$GITHUB_OUTPUT"
          npm run build
          mv dist rollback-dist
      - name: Research controlling legal sources and discovery indexes
        if: steps.gate.outputs.should_run == 'true'
        shell: bash
        env:
          AI_BASE_URL: ${{ vars.INTELLIGENCE_BASE_URL }}
          AI_MODEL: ${{ vars.INTELLIGENCE_MODEL }}
          AI_API_KEY: ${{ secrets.INTELLIGENCE_API_KEY }}
          INTELLIGENCE_FETCH_CONCURRENCY: "4"
        run: |
          for attempt in 1 2; do npm run update:laws && break; if [ "$attempt" = "2" ]; then exit 1; fi; sleep 30; done
          npx tsx scripts/check-critical-sources.ts --mode law
      - name: Integrate controlling-source legal changes
        if: steps.gate.outputs.should_run == 'true'
        id: integrate
        run: |
          npx tsx scripts/auto-publish.ts --mode law --github-output "$GITHUB_OUTPUT"
          npx tsx scripts/check-update-scope.ts --mode law
      - name: Validate complete release artifact
        if: steps.gate.outputs.should_run == 'true'
        env:
          URL: https://haidarra82066.github.io
          BASE_PATH: /noa-energy-atlas
        run: npm run validate:content && npm test && npm audit --omit=dev --audit-level=high && npm run build
      - name: Create local immutable release commit
        if: steps.gate.outputs.should_run == 'true' && steps.integrate.outputs.public_changed == 'true'
        shell: bash
        run: |
          git config user.name "noa-atlas-publisher"
          git config user.email "noa-atlas-publisher@users.noreply.github.com"
          git checkout -b "automation/legal-release-${{ github.run_id }}"
          git add updates/research/law-evidence.json updates/candidates/law.json updates/candidates/law-verification.json updates/candidates/law.md updates/pending-state/law.json updates/publication-ledger-law.jsonl src/data/automated-publications.json public/deployment-marker.json
          git commit -m "feat(intelligence): verified legal release ${{ steps.integrate.outputs.publication_id }} [skip pages]"
      - name: Upload current immutable Pages artifact
        if: steps.gate.outputs.should_run == 'true' && steps.integrate.outputs.public_changed == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-law-${{ github.run_id }}
          path: dist
      - name: Upload rollback Pages artifact
        if: steps.gate.outputs.should_run == 'true' && steps.integrate.outputs.public_changed == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-law-rollback-${{ github.run_id }}
          path: rollback-dist
      - name: Atomically deploy current artifact
        if: steps.gate.outputs.should_run == 'true' && steps.integrate.outputs.public_changed == 'true'
        id: deploy
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-law-${{ github.run_id }}
      - name: Smoke-test exact public marker
        if: steps.gate.outputs.should_run == 'true' && steps.integrate.outputs.public_changed == 'true'
        env:
          PUBLICATION_ID: ${{ steps.integrate.outputs.publication_id }}
          SMOKE_TIMEOUT_MS: "240000"
        run: node scripts/smoke-production.mjs https://haidarra82066.github.io/noa-energy-atlas "$PUBLICATION_ID"
      - name: Advance state and publish release commit only after smoke success
        if: steps.gate.outputs.should_run == 'true' && steps.integrate.outputs.public_changed == 'true'
        run: |
          npx tsx scripts/promote-update-state.ts --mode law
          git add updates/state/law.json updates/pending-state/law.json
          git commit --amend --no-edit
          git push origin HEAD:main
      - name: Commit successful no-op state without deploying
        if: steps.gate.outputs.should_run == 'true' && steps.integrate.outputs.public_changed != 'true'
        shell: bash
        run: |
          npx tsx scripts/promote-update-state.ts --mode law
          git config user.name "noa-atlas-publisher"; git config user.email "noa-atlas-publisher@users.noreply.github.com"
          git add updates/research/law-evidence.json updates/candidates/law.json updates/candidates/law-verification.json updates/candidates/law.md updates/pending-state/law.json updates/state/law.json updates/publication-ledger-law.jsonl
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(intelligence): successful legal no-op ${{ steps.gate.outputs.local_date }} [skip pages]"
          git push origin HEAD:main
      - name: Roll back if any post-deploy gate fails
        if: failure() && steps.deploy.outcome == 'success'
        id: rollback
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-law-rollback-${{ github.run_id }}
      - name: Verify restored public marker
        if: failure() && steps.rollback.outcome == 'success'
        env:
          PUBLICATION_ID: ${{ steps.previous.outputs.publication_id }}
          SMOKE_TIMEOUT_MS: "240000"
        run: node scripts/smoke-production.mjs https://haidarra82066.github.io/noa-energy-atlas "$PUBLICATION_ID"
      - name: Publication summary
        if: always() && steps.gate.outputs.should_run == 'true'
        run: echo "Legal run ${{ job.status }}; published ${{ steps.integrate.outputs.published_count || '0' }}; publication ${{ steps.integrate.outputs.publication_id || 'no-op' }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: legal-publication-failure-${{ github.run_id }}
          path: |
            updates/research/law-evidence.json
            updates/candidates/law.json
            updates/candidates/law-verification.json
            updates/candidates/law.md
          if-no-files-found: ignore
          retention-days: 30
